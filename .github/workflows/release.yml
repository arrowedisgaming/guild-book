name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate tag, package, and changelog agreement
        run: node scripts/release/validate-tag.mjs "$GITHUB_REF_NAME"

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://guildbook.arrowed.games
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify checkout is the tagged commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require protected Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Build the verified production source
        run: npm run build
        env:
          ADAPTER: cloudflare
          AUTH_SECRET: release-build-validation-only
      - name: Deploy the verified tag to Cloudflare Workers
        run: npx wrangler deploy --env ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
