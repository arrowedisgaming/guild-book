name: CI

# No `push: branches: [main]` trigger, deliberately. The "Protect main through
# pull requests" ruleset requires `check` and `e2e` on every pull request with
# `strict_required_status_checks_policy` on and an empty `bypass_actors` list, so
# a branch cannot reach main unless both jobs already passed on the exact merge
# result — the merge commit's tree is the tree the pull request tested. The
# post-merge run was a redundant gate on that same tree, not an independent one.
#
# It could still land differently: a flaky test or a drifting runner can flip a
# verdict on unchanged code. That argues for re-running deliberately, not on
# every merge. Drift is what the nightly schedule below covers — `npm ci` is
# lockfile-pinned, so nothing in the pull-request path can see a runner image or
# browser build change underneath a tree that has not.
on:
  workflow_call:
  pull_request:
    branches: [main]
  schedule:
    # 04:23 UTC daily, offset from the Tuesday e2e-stress cron so the two do not
    # contend for runners.
    - cron: '23 4 * * *'

# Supersede a pull request's own in-flight run when the branch is pushed again;
# those results are already answering a stale question. Scoped to pull requests
# on purpose: `workflow_call` runs this file as the release workflow's `verify`
# gate, and cancelling that would abort a release mid-verification. This is not
# the only concurrency in the release path — `release.yml` serialises on
# `production-release`, where a queued release can still be dropped if a third
# tag arrives while one is running and another is already waiting.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated content and pack version
        run: npm run content:verify:ci
        env:
          CONTENT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      # Hashes the committed derivatives against the committed manifest. The
      # default (source-independent) mode needs no ignored source scans, so it
      # runs here and in the clean release suite; it takes seconds.
      - name: Verify committed tarot artwork
        run: npm run tarot-art:verify
      - run: npm run check
      - run: npm run test
      - name: Build Cloudflare production bundle
        run: npm run build
        env:
          ADAPTER: cloudflare
          AUTH_SECRET: ci-build-validation-only
      # Standing guard that the Workers config stays deployable: validates
      # `main`, `[assets]`, the D1 binding, every `[[ratelimits]]` entry and the
      # custom-domain route against the installed Wrangler's own schema, without
      # shipping anything. This is what caught `binding =` vs `name =` on the
      # rate-limit bindings during Increment 5. Needs no Cloudflare credentials.
      - name: Validate the Workers deployment config
        run: npx wrangler deploy --dry-run --env ''
      - name: Validate the staging Workers deployment config
        run: npx wrangler deploy --dry-run --env staging

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run deterministic browser suite
        run: npm run test:e2e:ci
        env:
          AUTH_SECRET: ci-e2e-validation-only
      - name: Upload browser failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
